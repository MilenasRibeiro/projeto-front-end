<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Smart Finance</title>

</head>

<body>

    <div class="hero">

        <!-- MENU LATERAL -->

        <div class="container">

            <div class="logo">
                Smart Finance
            </div>


            <p id="menuDashboard">
                Dashboard
            </p>

            <p id="menuInsights">
                Insights
            </p>

            <p id="menuRelatorios">
                Relatórios
            </p>

        </div>


        <!-- ÁREA PRINCIPAL -->

        <div class="aside">


            <!-- DASHBOARD -->

            <div id="areaDashboard">

                <div class="dashboardCards">

                    <div class="cardInfos">

                        <h2>Saldo</h2>

                        <p id="saldo">
                            R$ 1800
                        </p>

                    </div>


                    <div class="cardInfos">

                        <h2>Despesas</h2>

                        <p>
                            R$ 1200
                        </p>

                    </div>

                </div>

            </div>

            <!-- INSIGHTS -->

            <div id="areaInsights"
                 style="display: none;">

                <div class="insights">

                    <h2>Insights Inteligentes</h2>

                    <div id="insights">

                        <p>
                            Seus gastos estão altos.
                        </p>

                        <p>
                            Você pode economizar em lazer.
                        </p>

                    </div>

                </div>

            </div>



            <!-- RELATÓRIOS -->

            <div id="areaRelatorios"
                 style="display: none;">

                <div class="graficos">

                    <h2>
                        Área de Relatórios
                    </h2>

                </div>

            </div>

        </div>

    </div>
    


    <script type="module"
        src="./js/dashboard.js">
    </script>
    <script type="module" src="./js/dashboard.js">
    </script>

</body>

</html>
